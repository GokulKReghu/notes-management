```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6fb;
            color: #333;
        }

        header {
            background: #343a75;
            color: white;
            padding: 22px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            font-size: 25px;
        }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 20px;
        }

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
        }

        input, textarea, select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            width: 100%;

            font-size: 15px;

        .search {
            max-width: 300px;

        .note-form {

            margin-bottom: 30px;
        }

        .note-form h3 {
            margin-bottom: 18px;
        }

        .note-form input,
        .note-form textarea,
        .note-form select {
            margin-bottom: 15px;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            border: none;
            padding: 11px 18px;

        .add-btn {
            background: #343a75;
            color: white;
        }

        .add-btn:hover {
            background: #252a5d;

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .note-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
            border-top: 4px solid #343a75;
        }

        .note-card h3 {
            margin-bottom: 12px;
        }

        .note-card p {
            color: #666;

        }

        .category {
            display: inline-block;

</head>

<body>

<header>
    <h2>📝 My Notes</h2>
    <span>Notes Management System</span>
</header>

<div class="container">

    <div class="top-section">
        <h2>My Notes</h2>
        <input type="text" id="search" class="search"
               placeholder="Search notes..." oninput="displayNotes()">
    </div>

    <div class="note-form">

        <h3 id="formTitle">Create New Note</h3>

        <input type="text" id="title" placeholder="Enter note title">

        <textarea id="content"
                  placeholder="Write your note here..."></textarea>

        <select id="category">
            <option value="Personal">Personal</option>
            <option value="Work">Work</option>
            <option value="Study">Study</option>
            <option value="Other">Other</option>
        </select>

        <button class="add-btn" onclick="saveNote()" id="saveBtn">
            + Add Note
        </button>

    </div>

    <div class="notes-grid" id="notesContainer"></div>

</div>

<script>

    let notes = JSON.parse(localStorage.getItem("notes")) || [];
    let editIndex = -1;

    function saveNote() {

        let title = document.getElementById("title").value.trim();
        let content = document.getElementById("content").value.trim();
        let category = document.getElementById("category").value;

        if (title === "" || content === "") {
            alert("Please enter both title and content!");
            return;
        }

        let note = {
            title: title,
            content: content,
            category: category,
            date: new Date().toLocaleDateString()
        };

        if (editIndex === -1) {
            notes.push(note);
        } else {
            notes[editIndex] = note;
            editIndex = -1;
            document.getElementById("formTitle").innerText = "Create New Note";
            document.getElementById("saveBtn").innerText = "+ Add Note";
        }

        localStorage.setItem("notes", JSON.stringify(notes));

        clearForm();
        displayNotes();
    }

    function displayNotes() {

        let container = document.getElementById("notesContainer");
        let search = document.getElementById("search").value.toLowerCase();

        container.innerHTML = "";

        let filteredNotes = notes
            .map((note, index) => ({...note, originalIndex: index}))
            .filter(note =>
                note.title.toLowerCase().includes(search) ||
                note.content.toLowerCase().includes(search) ||
                note.category.toLowerCase().includes(search)
            );

        if (filteredNotes.length === 0) {
            container.innerHTML = '<div class="empty">No notes found!</div>';
            return;
        }

        filteredNotes.forEach(note => {

            container.innerHTML += `
                <div class="note-card">

                    <span class="category">${escapeHTML(note.category)}</span>

                    <h3>${escapeHTML(note.title)}</h3>

                    <p>${escapeHTML(note.content).replace(/\n/g, "<br>")}</p>

                    <div class="date">Created: ${escapeHTML(note.date)}</div>

                    <button class="edit-btn"
                        onclick="editNote(${note.originalIndex})">
                        Edit
                    </button>

                    <button class="delete-btn"
                        onclick="deleteNote(${note.originalIndex})">
                        Delete
                    </button>

                </div>
            `;

        });

    }

    function editNote(index) {

        let note = notes[index];

        document.getElementById("title").value = note.title;
        document.getElementById("content").value = note.content;
        document.getElementById("category").value = note.category;

        editIndex = index;

        document.getElementById("formTitle").innerText = "Edit Note";
        document.getElementById("saveBtn").innerText = "Update Note";

        window.scrollTo({top: 0, behavior: "smooth"});
    }

    function deleteNote(index) {

        if (confirm("Are you sure you want to delete this note?")) {

            notes.splice(index, 1);

            localStorage.setItem("notes", JSON.stringify(notes));

            displayNotes();
        }

    }

    function clearForm() {

        document.getElementById("title").value = "";
        document.getElementById("content").value = "";
        document.getElementById("category").value = "Personal";

    }

    function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        })[char]);
    }

    displayNotes();

</script>

</body>
</html>
